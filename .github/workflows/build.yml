name: Android CI

on:
  push:
    branches: [ main, "siraj/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Report APK contents and size
        shell: bash
        run: |
          echo "=== APK file size ==="
          du -h app/build/outputs/apk/debug/*.apk
          echo "=== Largest packaged files ==="
          unzip -l app/build/outputs/apk/debug/*.apk | sort -nr | head -20

      - name: Build optimized release bundle
        run: ./gradlew bundleRelease

      - name: Upload release Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: siraj-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: siraj-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
